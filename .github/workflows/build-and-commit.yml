name: Build & Commit Theme

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Format theme artifacts
        run: npm run format

      # Internal PRs: Auto-commit built and formatted files back to the branch
      - name: Commit and push changes (Internal PRs)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update theme artifacts [skip ci]"
          file_pattern: "style.rics pear-ytm.css"

      # Fork PRs: Strict check for logic AND formatting match
      - name: Verify build artifacts & formatting (Fork PRs)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --exit-code style.rics pear-ytm.css > /dev/null; then
            echo "::error::Build artifacts or formatting are out of date!"
            echo "Please run 'npm run build && npm run format' locally and commit the updated style.rics and pear-ytm.css."
            git diff style.rics pear-ytm.css
            exit 1
          fi
